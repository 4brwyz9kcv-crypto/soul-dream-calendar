<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070b" />
    <meta name="description" content="Soul Dream Calendar – lokales, cyber-okkultes Tagesorakel mit Numerologie, Traum-Sigilen und PCB-Engel. Ohne Konto, ohne Server." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S.O.U.L" />

    <!-- Link-Vorschau. Ohne diese Angaben zeigen WhatsApp, Signal, Slack und
         Mastodon beim Teilen nur einen grauen Kasten. og:image muss absolut
         sein - relative Pfade lösen längst nicht alle Scraper auf. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="S.O.U.L" />
    <meta property="og:title" content="Soul Dream Calendar" />
    <meta property="og:description" content="Tagesorakel, Numerologie und Traum-Sigillen. Lokal auf deinem Gerät – kein Konto, kein Server." />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="%SDC_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soul Dream Calendar – geflügeltes Leiterbahn-Auge auf dunklem Grund" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Soul Dream Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
